<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <title>Inti Wasi · Gestión de usuarios</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="marca.svg" />
    <meta name="theme-color" content="#175B65" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('intiwasi.theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      if (document.documentElement.dataset.theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#102126';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
