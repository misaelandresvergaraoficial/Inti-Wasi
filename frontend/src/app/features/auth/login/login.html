<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800">DISTRIBUIDORA INTI WASI</h1>
      <p class="text-sm text-slate-500 mt-1">Gestión de Inventario y Almacén</p>
    </div>

    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
        <input type="email" [(ngModel)]="correo" name="correo" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"
          placeholder="admin.misael@intiwasi.pe">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" name="contrasena" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"
          placeholder="••••••••">
      </div>
      <button type="submit" [disabled]="loading"
        class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg disabled:opacity-50 transition-colors">
        {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>
