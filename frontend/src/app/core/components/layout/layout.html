<div class="flex h-screen bg-slate-100">

  <!-- Sidebar (Menú Lateral) -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-lg">
    <div class="p-5 border-b border-slate-800">
      <h1 class="text-xl font-bold text-amber-500 tracking-wide">INTI WASI</h1>
      <p class="text-xs text-slate-400 mt-1">Gestión de Almacén</p>
    </div>

    <nav class="flex-1 p-4 space-y-1 overflow-y-auto text-sm">
      <a routerLink="/dashboard" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Dashboard</span>
      </a>

      <a routerLink="/productos" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Catálogo de Productos</span>
      </a>

      <a routerLink="/ordenes-compra" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Órdenes de Compra</span>
      </a>

      <a routerLink="/movimientos" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Entradas y Salidas</span>
      </a>

      <a routerLink="/ajustes" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Ajustes de Inventario</span>
      </a>

      <a routerLink="/reportes" routerLinkActive="bg-amber-600 text-white font-semibold"
         class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 transition">
        <span>Kardex y Reportes</span>
      </a>
    </nav>

    <!-- Perfil del usuario al pie del menú -->
    <div class="p-4 border-t border-slate-800 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-slate-200 truncate w-36">{{ correoUsuario }}</p>
        <span class="inline-block mt-0.5 px-2 py-0.5 text-[10px] font-medium bg-amber-500/20 text-amber-400 rounded">
          {{ rolUsuario }}
        </span>
      </div>
      <button (click)="onLogout()" title="Cerrar sesión"
              class="text-slate-400 hover:text-red-400 p-2 rounded-lg hover:bg-slate-800 transition">
        ✕
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header Superior -->
    <header class="bg-white shadow-sm border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-slate-700">Sistema de Gestión de Almacén e Inventario</h2>
      <button (click)="onLogout()"
              class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-medium px-3 py-1.5 rounded-md border border-red-200 transition">
        Cerrar Sesión
      </button>
    </header>

    <!-- Área dinámica de componentes -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
