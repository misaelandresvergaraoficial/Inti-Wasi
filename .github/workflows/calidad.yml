name: Calidad

on:
  push:
    branches: [develop-v2, develop, main]
  pull_request:
    branches: [develop-v2, develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compilación, pruebas y cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bd_intiwasi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/bd_intiwasi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: clave-de-prueba-ci-sin-valor-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client || sudo apt-get install -y -qq default-mysql-client
      - name: Cargar esquema de pruebas
        run: mysql -h 127.0.0.1 -uroot -proot bd_intiwasi < backend/src/test/resources/ci/schema.sql
      - name: Compilar, probar y medir cobertura
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Pcobertura verify
      - name: Publicar reportes backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
          if-no-files-found: warn

  frontend:
    name: Frontend (pruebas, cobertura y build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas y cobertura
        run: npm test -- --watch=false
      - name: Build de producción
        run: npm run build
      - name: Publicar reportes frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-frontend
          path: |
            frontend/coverage
            frontend/dist/inti-wasi-frontend/browser
          if-no-files-found: warn
