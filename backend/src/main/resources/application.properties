spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./application-local.properties

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.application.name=backend
springdoc.swagger-ui.csrf.enabled=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_intiwasi?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
logging.level.org.springframework=INFO

jwt.secreto=${JWT_SECRET}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}

management.endpoint.health.show-details=never

spring.datasource.hikari.connection-init-sql=SET time_zone = '-05:00'
