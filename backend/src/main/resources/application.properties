spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_intiwasi?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
logging.level.org.springframework=INFO

jwt.secreto=${JWT_SECRET}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:7200000}