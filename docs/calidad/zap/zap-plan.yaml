env:
  contexts:
    - name: intiwasi
      urls:
        - http://localhost:8080
      includePaths:
        - http://localhost:8080.*
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: intiwasi
      url: http://localhost:8080/swagger-ui/index.html
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: activeScan
    parameters:
      context: intiwasi
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 6
      addQueryParam: false
      defaultPolicy: true

  - type: report
    parameters:
      template: traditional-html
      reportDir: C:/agentes/agente-solucionesweb-calidad/proyecto/Inti-Wasi/docs/calidad
      reportFile: zap-report
      reportTitle: OWASP ZAP - Inti Wasi
      reportDescription: Escaneo DAST del backend local

  - type: report
    parameters:
      template: traditional-json
      reportDir: C:/agentes/agente-solucionesweb-calidad/proyecto/Inti-Wasi/docs/calidad
      reportFile: zap-report
      reportTitle: OWASP ZAP - Inti Wasi

